services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: xtyres-backend-app
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - .env
    ports:
      - '8000:8000'
      - '5173:5173'
    volumes:
      - .:/var/www/html
      - backend_vendor:/var/www/html/vendor
      - backend_node_modules:/var/www/html/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    command:
      - sh
      - docker/start.sh

  postgres:
    image: postgres:16-alpine
    container_name: xtyres-backend-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: xtyres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  backend_vendor:
  backend_node_modules:
  pgdata:
