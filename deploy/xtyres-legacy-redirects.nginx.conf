# Legacy WordPress/WooCommerce redirects for xtyres.md.
#
# Include this file inside the xtyres.md `server { ... }` block, before the
# generic proxy/fallback to the frontend app.
#
# Example:
#   server {
#       server_name xtyres.md www.xtyres.md;
#       include /path/to/deploy/xtyres-legacy-redirects.nginx.conf;
#       ...
#   }

# --- Exact static page aliases ------------------------------------------------
location = /contact/ {
    return 301 /contacts;
}

location = /contact {
    return 301 /contacts;
}

location = /contacts/ {
    return 301 /contacts;
}

location = /despre/ {
    return 301 /despre;
}

location = /livrare/ {
    return 301 /contacts;
}

# --- WooCommerce shop ---------------------------------------------------------
# Old shop listing and paginated shop listing.
location ~ ^/shop(?:/page/[0-9]+)?/?$ {
    set $target "/products?category=anvelope";

    if ($arg_filter_season = "vara") {
        set $target "/products?category=anvelope&filters=%5B%7B%22attribute_id%22%3A12%2C%22type%22%3A%22select%22%2C%22values%22%3A%5B46%5D%7D%5D";
    }

    if ($arg_filter_season = "iarna") {
        set $target "/products?category=anvelope&filters=%5B%7B%22attribute_id%22%3A12%2C%22type%22%3A%22select%22%2C%22values%22%3A%5B55%5D%7D%5D";
    }

    if ($arg_filter_season = "all-season") {
        set $target "/products?category=anvelope&filters=%5B%7B%22attribute_id%22%3A12%2C%22type%22%3A%22select%22%2C%22values%22%3A%5B49%5D%7D%5D";
    }

    return 301 $target;
}

# Product URLs already match the new frontend route. Normalize trailing slash.
location ~ ^/produs/([^/]+)/$ {
    return 301 /produs/$1;
}

# --- Product categories -------------------------------------------------------
# Main categories and their paginated archives.
location ~ ^/product-category/anvelope(?:/page/[0-9]+)?/?$ {
    return 301 /products?category=anvelope;
}

location ~ ^/product-category/acumulatoare(?:/page/[0-9]+)?/?$ {
    return 301 /products?category=acumulatoare;
}

# Nested old brand archives:
# /product-category/anvelope/hankook/
# /product-category/anvelope/hankook/page/2/
location ~ ^/product-category/anvelope/([^/]+)(?:/page/[0-9]+)?/?$ {
    return 301 /products?category=$1;
}

# Nested old battery brand archives:
# /product-category/acumulatoare/bosch/
location ~ ^/product-category/acumulatoare/([^/]+)(?:/page/[0-9]+)?/?$ {
    return 301 /products?category=$1;
}

# Direct old tire brand archives:
# /product-category/hankook/
# /product-category/roadx/page/3/
location ~ ^/product-category/(hankook|pirelli|maxxis|matador|continental|michelin|uniroyal|viking|nokian|arivo|roadx|sailun|bridgestone|kumho|tracmax|yokohama|firestone|nexen|riken|platin|tourador|goodyear|dunlop|debica|barum|gislaved|laufenn|tigar|kormoran|linglong|triangle|westlake|zeetex|lassa|petlas|kapsen|goodride|aptany|mirage|ovation|powertrac|sunfull|windforce|grenlander|nankang|wanli|minerva|imperial|austone|fortune|landsail|doublestar|fronway|lanvigator|royal-black|annaite|compasal|toyo|falken|fulda|semperit|general-tire|bfgoodrich)(?:/page/[0-9]+)?/?$ {
    return 301 /products?category=$1;
}

# Direct old battery brand archives:
# /product-category/bosch/
location ~ ^/product-category/(bosch|varta|energizer|exide|mutlu|forse|autopart|rocket|tab|topla|banner|rombat|black-horse|monbat|yuasa|akom|ista|west-volt)(?:/page/[0-9]+)?/?$ {
    return 301 /products?category=$1;
}

# Any other one-level WooCommerce category goes to the new catalog category.
location ~ ^/product-category/([^/]+)(?:/page/[0-9]+)?/?$ {
    return 301 /products?category=$1;
}

# --- WooCommerce utility pages ------------------------------------------------
location = /cart/ {
    return 301 /cart;
}

location = /checkout/ {
    return 301 /checkout;
}

location ~ ^/(my-account|wishlist|compare)/?$ {
    return 301 /;
}

# --- WordPress internals and feeds -------------------------------------------
location ~ ^/(wp-content|wp-includes|wp-admin|wp-json|xmlrpc\.php) {
    return 301 /;
}

location ~ ^/(feed|comments/feed)/?$ {
    return 301 /;
}

# --- Old Yoast sitemap URLs ---------------------------------------------------
# The new frontend serves /sitemap.xml and /robots.txt from xtyres-frontend/public.
# These legacy sitemap URLs should redirect instead of falling through to the SPA.
location = /sitemap_index.xml { return 301 /sitemap.xml; }
location = /post-sitemap.xml { return 301 /sitemap.xml; }
location = /page-sitemap.xml { return 301 /sitemap.xml; }
location = /product-sitemap1.xml { return 301 /sitemap.xml; }
location = /product-sitemap2.xml { return 301 /sitemap.xml; }
location = /product-sitemap3.xml { return 301 /sitemap.xml; }
location = /product_cat-sitemap.xml { return 301 /sitemap.xml; }
location = /member-sitemap.xml { return 301 /sitemap.xml; }
location = /service-sitemap.xml { return 301 /sitemap.xml; }
location = /unique-sitemap.xml { return 301 /sitemap.xml; }
location = /staff_taxonomy-sitemap.xml { return 301 /sitemap.xml; }
location = /services_taxonomy-sitemap.xml { return 301 /sitemap.xml; }
